name: Zephyr Docker Images 

on:
  repository_dispatch:
    types: [build-sdk]

jobs:
  sdk-release:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: get version
        id: zephyr_version
        uses: ./.github/actions/zephyr_revision

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
            driver: docker

      - name: Build Base
        uses: ./.github/actions/build
        with:
          image_name: zephyr-full-sdk
          dockerfile: Dockerfile.base

      - name: Build Devel
        uses: ./.github/actions/build
        with:
          image_name: zephyr-devel
          dockerfile: Dockerfile.devel

      - name: Build CI
        uses: ./.github/actions/build
        with:
          image_name: zephyr-ci
          dockerfile: Dockerfile.ci

      - name: Publish
        if: github.event_name == 'workflow_dispatch'
        uses: ./.github/actions/publish
        with:
          tag: ${{ steps.zephyr_version.outputs.sha }}
          images: |
            zephyr-full-sdk
            zephyr-devel
            zephyr-ci
