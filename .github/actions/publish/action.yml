name: Push Docker Image 
inputs:
  local_image:
    required: true
  remote_tag:
    required: true

runs:
  using: "composite"
  steps:
    - name: Login to GHCR
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Tag and Push
      shell: bash
      run: |
        # Convert comma-separated list to space-separated for the bash loop

        for IMG in ${{ inputs.images }}; do
          REMOTE_FULL_PATH="${{ inputs.registry }}/zephyr/$IMG:${{ inputs.tag }}"
          
          docker tag local/$IMG:latest $REMOTE_FULL_PATH
          docker push $REMOTE_FULL_PATH

        done
